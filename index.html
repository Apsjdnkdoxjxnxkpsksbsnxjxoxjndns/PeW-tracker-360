:root{font-family:Inter,system-ui,sans-serif;color:#211f31;background:#f8f9fc}*{box-sizing:border-box}body{margin:0;background:#f8f9fc}.purple{background:#5a4bda}.ink{color:#5a4bda}.card{background:#fff;border:1px solid #eceaf4;border-radius:18px;box-shadow:0 3px 14px #211f3108}.btn{border-radius:12px;padding:10px 13px;font-size:13px;font-weight:700;transition:.15s}.btn:active{transform:scale(.98)}.primary{background:#5a4bda;color:#fff}.soft{background:#f1effe;color:#5144c5}.green{background:#059669;color:white}.green-soft{background:#ecfdf5;color:#047857}.amber-soft{background:#fffbeb;color:#b45309}.field{width:100%;padding:11px 12px;border:1px solid #e4e1ee;border-radius:12px;background:white;outline:none;font-size:14px}.field:focus{border-color:#8a80ed;box-shadow:0 0 0 3px #5a4bda18}.muted{color:#858197}.progress{height:8px;border-radius:99px;background:#efedf5;overflow:hidden}.progress i{display:block;height:100%;background:#5a4bda;border-radius:99px;transition:width .25s}.pill{border-radius:99px;padding:6px 10px;font-size:11px;font-weight:800;white-space:nowrap}.navpill{padding:10px 13px;border-radius:12px;font-size:12px;font-weight:750;white-space:nowrap}.navpill.active{background:#5a4bda;color:white}.modalbg{background:#17142b99;backdrop-filter:blur(3px)}.hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{scrollbar-width:none}.task{border:1px solid #eceaf4;border-radius:16px;background:white;padding:15px}.subject-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.tabbtn{border-radius:12px;padding:11px 8px;text-align:center;font-size:12px;font-weight:750;background:white;border:1px solid #eceaf4}.tabbtn.active{background:#f1effe;color:#5144c5;border-color:#d9d4ff}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#211f31;color:white;padding:12px 17px;border-radius:12px;z-index:90;font-size:13px;box-shadow:0 8px 30px #0002}.stepdot{width:8px;height:8px;border-radius:50%;background:#d7d4e2}.stepdot.on{background:#fff;width:20px}.source-card{border:1px solid #d9f3e8;border-radius:16px;background:white;overflow:hidden}.source-top{background:linear-gradient(120deg,#047857,#10b981);color:white}.bar{height:5px;border-radius:9px;background:#e8e6ef}.bar>i{display:block;height:100%;background:#059669;border-radius:9px}

<body><div id="app"></div>
<script>
const CURRICULA={
 Commerce:{emoji:"📊",label:"Commerce",subjects:[["Accountancy","CA Rajat Arora","Partnership Accounts"],["Economics","Saleem Sir","National Income & Macroeconomics"],["Business Studies","Love Kaushik","Principles of Management"],["Applied Mathematics","Sachin Jakhar","Financial Mathematics"],["CA Foundation","Faculty Team","Business Laws"]],practice:["Accountancy Balance Sheet Drill","Economics DPP","Business Case Study"]},
 Arts:{emoji:"🏛️",label:"Arts / Humanities",subjects:[["History","Humanities Faculty","Modern Indian History"],["Political Science","Humanities Faculty","Indian Constitution"],["Geography","Humanities Faculty","Physical Geography"],["Sociology","Humanities Faculty","Social Institutions"],["Psychology","Humanities Faculty","Learning & Memory"]],practice:["History Answer Writing","Geography Map Drill","NCERT Chapter Test"]},
 NEET:{emoji:"🩺",label:"NEET",subjects:[["Physics","NEET Faculty","Laws of Motion"],["Chemistry","NEET Faculty","Chemical Bonding"],["Botany","Biology Faculty","Plant Kingdom"],["Zoology","Biology Faculty","Human Physiology"]],practice:["NCERT Line-by-Line DPP","NEET PYQ Bank","720-Mark Mock Test"]},
 JEE:{emoji:"⚙️",label:"JEE / Foundation",subjects:[["Mathematics","JEE Faculty","Limits & Continuity"],["Physics","JEE Faculty","Work, Energy & Power"],["Chemistry","JEE Faculty","Organic Chemistry"]],practice:["JEE Main DPP","JEE Advanced Problem Set","300-Mark Practice Test"]}
};
const FREE=[
["Accountancy","Partnership Fundamentals — One Shot","Commerce","2h 14m","Commerce Faculty","Partnership accounts basics, profit-sharing ratio and goodwill."],
["Economics","National Income — Complete Chapter","Commerce","1h 48m","Economics Faculty","GDP, GNP, NDP, national income aggregates and methods."],
["Business Studies","Principles of Management — Full Chapter","Commerce","1h 32m","Commerce Faculty","Meaning, principles, techniques and Fayol's contributions."],
["History","Modern Indian History — Revolt of 1857","Arts","58m","History Faculty","Causes, centres, leaders and consequences of the revolt."],
["Political Science","Indian Constitution — Key Features","Arts","1h 12m","Political Science Faculty","Constitutional framework, rights, duties and institutions."],
["Geography","Physical Geography — Climatology","Arts","1h 26m","Geography Faculty","Atmosphere, pressure belts, winds and rainfall."],
["Physics","Laws of Motion — Complete Lecture","NEET/JEE","1h 42m","Physics Faculty","Newton's laws, free body diagrams and friction concepts."],
["Chemistry","Chemical Bonding — One Shot","NEET/JEE","2h 05m","Chemistry Faculty","Ionic, covalent, VSEPR, hybridisation and molecular shape."],
["Biology","Human Physiology — Digestion","NEET","1h 18m","Biology Faculty","Digestive system, enzymes and absorption."],
["Maths","Limits & Continuity — Full Chapter","JEE","1h 36m","Mathematics Faculty","Limits, standard forms, continuity and solved examples."],
["CA Foundation","Business Laws — Contract Act Basics","Commerce","1h 10m","CA Faculty","Offer, acceptance, consideration and essentials of a contract."]
];
const initial={
 stream:"Commerce",mode:"Recorded",planner:0,planners:[{name:"Commerce 12th + CUET",stream:"Commerce"},{name:"Arts + Humanities",stream:"Arts"},{name:"Science Preparation",stream:"NEET"}],
 speed:1.5,revision:60,revisionDone:false,streak:11,day:"",tasks:[],notes:[],doneVideos:[],setupStep:1,setupDone:false,
 teachers:[],selectedSubjects:[],dailyCapacity:"6–8 hours Steady",backlogStrategy:"A little each day",noteMinutes:10,backlogAction:"",testAction:"",tourStep:0
};
let state;try{state={...initial,...JSON.parse(localStorage.getItem("tracker360pro")||"{}")}}catch{state={...initial}};
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>localStorage.setItem("tracker360pro",JSON.stringify(state));
const subjects=()=>CURRICULA[state.stream].subjects;
function seedTasks(){let id=Date.now();return [
{id:id+1,subject:subjects()[0][0],teacher:subjects()[0][1],title:subjects()[0][2]+" — Lecture 04",chapter:subjects()[0][2],kind:"LECTURE",minutes:80,done:false,due:"Today",percent:45},
{id:id+2,subject:subjects()[1]?.[0]||subjects()[0][0],teacher:subjects()[1]?.[1]||"Faculty",title:(subjects()[1]?.[2]||"Revision")+" — Lecture 03",chapter:subjects()[1]?.[2]||"Revision",kind:"LECTURE",minutes:55,done:false,due:"Today",percent:0},
{id:id+3,subject:subjects()[0][0],teacher:"Practice Bank",title:CURRICULA[state.stream].practice[0],chapter:subjects()[0][2],kind:"DPP",minutes:25,done:false,due:"Today",percent:0},
{id:id+4,subject:subjects()[2]?.[0]||subjects()[0][0],teacher:subjects()[2]?.[1]||"Faculty",title:subjects()[2]?.[2]||"Revision",chapter:subjects()[2]?.[2]||"Revision",kind:"LECTURE",minutes:50,done:false,due:"Tomorrow",percent:0}
]}
if(!state.tasks.length)state.tasks=seedTasks();
if(!state.selectedSubjects.length)state.selectedSubjects=subjects().map(s=>s[0]);
if(!state.teachers.length)state.teachers=subjects().map(s=>s[1]);
save();
let timer={left:1500,running:false,interval:null};let toastTimer;
function toast(s){let n=$("#toast");if(!n){n=document.createElement("div");n.id="toast";document.body.append(n)}n.className="toast";n.textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2400)}
function mins(n){return Math.floor(n/60)?Math.floor(n/60)+"h "+(n%60? n%60+"m":""):n+"m"}
function update(patch){state={...state,...patch};save();render()}
function switchStream(stream){state.stream=stream;state.selectedSubjects=CURRICULA[stream].subjects.map(s=>s[0]);state.teachers=CURRICULA[stream].subjects.map(s=>s[1]);state.tasks=seedTasks();state.revisionDone=false;save();render();toast(stream+" planner loaded")}
function doneTask(id){state.tasks=state.tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();render();toast("Study progress updated")}
function moveTask(id,due){state.tasks=state.tasks.map(t=>t.id===id?{...t,due}:t);save();render();toast("Lecture moved to "+due)}
function openModal(title,body){$("#modal-title").textContent=title;$("#modal-body").innerHTML=body;$("#modal").classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden")}
function totalRemaining(){return state.tasks.filter(t=>!t.done&&t.due==="Today").reduce((a,t)=>a+Math.ceil(t.minutes/state.speed),0)+(state.revisionDone?0:state.revision)}
function progress(){let today=state.tasks.filter(t=>t.due==="Today");let done=today.filter(t=>t.done).length+(state.revisionDone?1:0);return Math.round(done/(today.length+1)*100)}
function taskHTML(t){let d=Math.ceil(t.minutes/state.speed);return '<article class="task space-y-3"><div class="flex justify-between gap-2"><div class="min-w-0"><div class="text-[10px] font-extrabold tracking-wide ink">'+esc(t.subject.toUpperCase())+' · '+esc(t.kind)+'</div><div class="font-bold text-sm mt-1">'+esc(t.title)+'</div><div class="text-xs muted mt-1">'+esc(t.teacher)+' · '+mins(d)+' at '+state.speed+'× <span class="muted">('+mins(t.minutes)+' at 1×)</span></div></div><span class="pill '+(t.done?'green-soft':t.due==="Overdue"?'bg-rose-50 text-rose-600':'amber-soft')+'">'+(t.done?'DONE':esc(t.due).toUpperCase())+'</span></div>'+(t.kind==="LECTURE"?'<div class="flex justify-between text-[11px] muted"><span>Watch progress</span><span>'+(t.done?100:t.percent)+'%</span></div><div class="progress"><i style="width:'+(t.done?100:t.percent)+'%"></i></div>':'')+'<div class="flex flex-wrap gap-2"><button class="btn soft" onclick="watchTask('+t.id+')">▶ Open lecture ↗</button><select class="field !w-auto flex-1 text-xs" onchange="moveTask('+t.id+',this.value)"><option value="'+esc(t.due)+'">Move / Skip</option><option>Tomorrow</option><option>This week</option><option>Overdue</option></select><button class="btn '+(t.done?'soft':'primary')+'" onclick="doneTask('+t.id+')">'+(t.done?'Undo':'✓ Done')+'</button></div></article>'}
function accordion(name,content,open=false){return '<section class="card overflow-hidden"><button class="w-full p-4 flex justify-between font-extrabold text-sm" onclick="this.nextElementSibling.classList.toggle(\'hidden\');this.lastElementChild.textContent=this.nextElementSibling.classList.contains(\'hidden\')?\'+\':\'−\'">'+name+' <span class="ink">'+(open?'−':'+')+'</span></button><div class="'+(open?'':'hidden')+' px-4 pb-4">'+content+'</div></section>'}
function dayView(){let today=state.tasks.filter(t=>t.due==="Today"),done=today.filter(t=>t.done).length,rem=totalRemaining(),pct=progress();let sub=subjects();return '<div class="space-y-4"><section><div class="text-xs muted">'+new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"})+' · '+esc(state.planners[state.planner]?.name||"My planner")+'</div><div class="flex justify-between items-start mt-1"><h1 class="text-2xl font-extrabold">Good afternoon, Student 👋</h1><button class="btn soft" onclick="resetDay()">Reset day</button></div><div class="flex flex-wrap gap-2 mt-3"><span class="pill bg-orange-50 text-orange-700">🔥 '+state.streak+' days in a row</span><span class="pill bg-green-50 text-green-700">● On track</span><span class="pill soft">'+esc(state.stream)+'</span></div></section>
<section class="card p-4"><div class="flex justify-between gap-3"><div><div class="font-extrabold text-sm">Time left for today</div><div class="text-xs muted mt-1">'+done+' of '+today.length+' study tasks completed</div></div><div class="text-right"><div class="text-2xl font-extrabold ink">'+mins(rem)+'</div><div class="text-[10px] muted">estimated remaining</div></div></div><div class="progress mt-3"><i style="width:'+pct+'%"></i></div><div class="flex justify-between items-center mt-2 text-xs muted"><span>'+pct+'% complete · '+state.speed+'× playback</span><button class="font-bold ink" onclick="allDone()">✓✓ All done for today</button></div></section>
<div class="space-y-3">'+accordion('Your subjects · '+state.selectedSubjects.length+' subjects',sub.map(s=>{let ts=state.tasks.filter(t=>t.subject===s[0]),n=ts.length?Math.round(ts.filter(t=>t.done).length/ts.length*100):0;return '<div class="mb-3"><div class="flex justify-between text-xs font-bold"><span>'+esc(s[0])+'</span><span class="muted">'+n+'% · '+esc(s[1])+'</span></div><div class="progress mt-2"><i style="width:'+n+'%"></i></div></div>'}).join(''),true)+accordion('Your tests · 1 upcoming', '<div class="text-sm font-bold">All India '+(state.stream==='JEE'?'JEE':'')+' Mock Practice</div><p class="text-xs muted mt-1">3 hours · '+(state.stream==='NEET'?'180 questions · 720 marks':state.stream==='JEE'?'90 questions · 300 marks':'60 questions · 300 marks')+'</p><button class="btn soft mt-3" onclick="openTest()">View practice test</button>')+accordion('Your week', '<div class="grid grid-cols-7 gap-1 text-center">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>'<div class="rounded-xl p-2 '+(i===((new Date().getDay()+6)%7)?'bg-purple-50 text-purple-700':'bg-gray-50')+'"><div class="text-[9px] font-bold">'+d+'</div><div class="text-xs mt-2">'+(i===((new Date().getDay()+6)%7)?'📍':i<((new Date().getDay()+6)%7)?'✅':i===4?'📝':'Plan')+'</div></div>').join('')+'</div>')+'</div>
<section class="card p-4 border-l-4 border-amber-500"><div class="text-xs font-extrabold text-amber-700">NEEDS YOUR ANSWER · TEST PRIORITY</div><div class="font-bold mt-2 text-sm">Upcoming All India Mock Test</div><p class="text-xs muted mt-1">Prioritise chapters you have not revised yet?</p><div class="flex gap-2 mt-3"><button class="btn primary" onclick="testPriority(true)">Yes, do these first</button><button class="btn soft" onclick="testPriority(false)">No, keep my plan</button></div></section>
<section class="card p-4 border-l-4 border-rose-400"><div class="text-xs font-extrabold text-rose-600">BACKLOG CATCH-UP</div><div class="font-bold mt-2 text-sm">You have older classes to review</div><p class="text-xs muted mt-1">'+esc(sub[0][0])+': 6h of old classes · '+esc(sub[1]?.[0]||sub[0][0])+': 5h of old classes</p><div class="flex flex-wrap gap-2 mt-3"><button class="btn soft" onclick="backlog('date')">Finish by a date</button><button class="btn soft" onclick="backlog('daily')">A little each day</button><button class="btn soft" onclick="backlog('later')">Ask me later</button></div></section>
<section class="card p-4"><div class="flex justify-between"><div><div class="font-extrabold text-sm">Revision & module practice</div><div class="text-xs muted mt-1">Daily self-study block · '+mins(state.revision)+'</div></div><span class="pill '+(state.revisionDone?'green-soft':'amber-soft')+'">'+(state.revisionDone?'DONE':'DAILY')+'</span></div><p class="text-xs muted mt-2">Revise key ideas, practise questions and write a short recall summary.</p><button class="btn '+(state.revisionDone?'soft':'primary')+' mt-3" onclick="update({revisionDone:!state.revisionDone})">'+(state.revisionDone?'Undo revision':'✓ Mark revision done')+'</button></section>
<section class="card p-4 border border-amber-200"><div class="text-[10px] font-extrabold text-amber-700">A TEST TO TAKE</div><div class="font-bold mt-2">Chapter practice · '+esc(state.stream)+'</div><p class="text-xs muted mt-1">3H · '+(state.stream==='NEET'?'180 questions · 720 marks':state.stream==='JEE'?'90 questions · 300 marks':'60 questions · 300 marks')+' · '+esc(sub.map(s=>s[0]).slice(0,3).join(', '))+'</p><div class="flex gap-2 mt-3"><button class="btn primary flex-1" onclick="openTest()">Take the test ↗</button><button class="btn soft" onclick="toast('Test saved for later')">Take later</button><button class="btn soft" onclick="toast('Test moved to another day')">Another day</button></div></section>
<section><div class="flex justify-between items-center mb-3"><h2 class="font-extrabold">Today's '+(state.mode==='Live'?'Live Classes':'Scheduled Lectures')+'</h2><span class="text-xs muted">'+today.length+' items</span></div><div class="space-y-3">'+(today.length?today.map(taskHTML).join(''):'<div class="card p-5 text-center text-sm muted">No tasks scheduled for today. Add a free lesson or enjoy your free time.</div>')+'</div></section>
<section class="card p-4"><div class="flex justify-between items-center"><div><div class="font-extrabold text-sm">Practice Bank</div><div class="text-xs muted mt-1">'+CURRICULA[state.stream].practice.length+' practice sets ready · DPPs & drills</div></div><button class="btn soft" onclick="chooseDpp()">📊 Choose DPPs</button></div><button class="text-xs ink font-bold mt-3" onclick="autoDpp()">＋ Auto-schedule practice items</button></section>
<section class="card p-4"><div class="font-extrabold text-sm">Tomorrow's preview</div><div class="space-y-2 mt-3">'+(state.tasks.filter(t=>t.due==="Tomorrow").map(t=>'<div class="flex justify-between text-xs"><span>'+esc(t.subject)+' · '+esc(t.title)+'</span><span class="muted">'+mins(Math.ceil(t.minutes/state.speed))+'</span></div>').join('')||'<p class="text-xs muted">Nothing planned yet. Skipped lectures will appear here.</p>')+'</div></section></div>'}
function sourceView(){let q=$("#source-search")?.value||"",filter=window.sourceFilter||"All";let cards=FREE.filter(v=>(filter==="All"||v[0]===filter||v[2]===filter)&&v.join(" ").toLowerCase().includes(q.toLowerCase()));return '<div class="space-y-4"><section class="source-top rounded-2xl p-5"><div class="text-xs font-extrabold tracking-widest opacity-80">TRACKER 360 PRO · FREE SOURCE</div><h1 class="text-2xl font-extrabold mt-2">Learn more. Spend less. 🌿</h1><p class="text-sm mt-2 opacity-90">Free one-shot lectures, full chapter learning and revision notes across Commerce, Arts, NEET and JEE.</p><div class="flex gap-2 mt-4 flex-wrap"><span class="pill bg-white/20">▶ Free video search</span><span class="pill bg-white/20">📄 Chapter notes</span><span class="pill bg-white/20">＋ Add to your day</span></div></section><input id="source-search" class="field" placeholder="Search chapter, topic, subject or teacher…" oninput="refreshSource()"><div class="flex gap-2 overflow-x-auto hide-scroll pb-1">'+['All','Accountancy','Economics','Business Studies','History','Political Science','Geography','Physics','Chemistry','Biology','Maths','CA Foundation'].map(f=>'<button class="pill '+(filter===f?'green text-white':'green-soft')+'" onclick="window.sourceFilter='+JSON.stringify(f)+';refreshSource()">'+f+'</button>').join('')+'</div><div class="text-xs muted">'+cards.length+' free learning resources</div><div class="space-y-3">'+cards.map(v=>'<article class="source-card"><div class="p-4"><div class="flex justify-between gap-2"><span class="pill green-soft">'+esc(v[0])+'</span><span class="text-[10px] muted">▶ '+esc(v[3])+'</span></div><div class="font-extrabold mt-3">'+esc(v[1])+'</div><div class="text-xs muted mt-1">'+esc(v[4])+' · Open learning search</div><div class="flex flex-wrap gap-2 mt-4"><button class="btn green" onclick="watchFree('+FREE.indexOf(v)+')">▶ Watch Free</button><button class="btn green-soft" onclick="showNotes('+FREE.indexOf(v)+')">📄 PDF Notes</button><button class="btn soft" onclick="addFree('+FREE.indexOf(v)+')">＋ Add to Day</button></div></div></article>').join('')||'<div class="card p-5 text-sm muted">No matching lessons. Try another subject or keyword.</div>'}</div><p class="text-[11px] muted">Free Source opens YouTube search results for the exact topic rather than claiming an unverified video is official. Check the publisher before watching.</p></div>'}
function refreshSource(){let el=$("#source-area");if(el){let q=$("#source-search")?.value||"";el.innerHTML=sourceView();let inp=$("#source-search");inp.value=q;inp.focus();inp.setSelectionRange(q.length,q.length)}}
function setupView(){let s=state.setupStep;let titles=["Your teachers","Where you are","Your speed","Your day","Your plan"];let content="";
if(s===1)content='<p class="text-sm muted">Choose the faculty you want to follow for each subject.</p>'+subjects().map((x,i)=>'<label class="flex items-center justify-between py-3 border-b text-sm"><span><b>'+esc(x[0])+'</b><span class="block text-xs muted">'+esc(x[1])+'</span></span><input type="checkbox" '+(state.teachers.includes(x[1])?'checked':'')+' onchange="toggleTeacher('+i+',this.checked)"></label>').join('');
if(s===2)content='<p class="text-sm muted">Your current study plan snapshot.</p><div class="grid grid-cols-3 gap-2 mt-4">'+[['Classes taught','46'],['Subjects',state.selectedSubjects.length],['To watch back','13h']].map(x=>'<div class="bg-purple-50 rounded-xl p-3 text-center"><b class="text-xl ink">'+x[1]+'</b><div class="text-[10px] muted mt-1">'+x[0]+'</div></div>').join('')+'</div><p class="text-sm mt-4">Backlog strategy can be changed in the final step.</p>';
if(s===3)content='<label class="block text-sm font-bold">Playback speed <span class="ink">'+state.speed+'×</span><input type="range" min="1" max="2" step=".25" value="'+state.speed+'" class="w-full mt-3" oninput="setSpeed(this.value)"></label><div class="text-xs muted mt-2">Estimated watch time saved: '+Math.round((1-1/state.speed)*13*60)+' minutes across 13 hours of backlog.</div><label class="block text-sm font-bold mt-5">Note-writing time per class (minutes)<input class="field mt-2" type="number" min="0" max="90" value="'+state.noteMinutes+'" onchange="update({noteMinutes:+this.value})"></label>';
if(s===4)content='<div class="space-y-3"><div class="font-bold text-sm">Daily study capacity</div>'+['6–8 hours Steady','10–12 hours Challenging'].map(x=>'<button class="w-full text-left p-3 rounded-xl border '+(state.dailyCapacity===x?'border-purple-400 bg-purple-50':'')+'" onclick="update({dailyCapacity:'+JSON.stringify(x)+'})">'+x+'</button>').join('')+'<div class="font-bold text-sm mt-4">Daily revision duration</div>'+['30 min','1h','1h 30m','2h'].map(x=>'<button class="pill mr-2 mb-2 '+((state.revision===({ "30 min":30,"1h":60,"1h 30m":90,"2h":120})[x])?'purple text-white':'bg-gray-100')+'" onclick="update({revision:'+({"30 min":30,"1h":60,"1h 30m":90,"2h":120}[x])+'})">'+x+'</button>').join('')+'</div>';
if(s===5)content='<div class="space-y-3">'+['Finish by a date','A little each day'].map(x=>'<button class="w-full text-left p-4 rounded-xl border '+(state.backlogStrategy===x?'border-purple-400 bg-purple-50':'')+'" onclick="update({backlogStrategy:'+JSON.stringify(x)+'})"><b>'+x+'</b><p class="text-xs muted mt-1">'+(x==='Finish by a date'?'Set a target date and distribute backlog sessions.':'Add a manageable amount of backlog to each study day.')+'</p></button>').join('')+'</div>';
return '<div class="space-y-4"><div><div class="text-xs ink font-extrabold">PERSONALISE YOUR PLAN · STEP '+s+' OF 5</div><h1 class="text-2xl font-extrabold mt-2">'+titles[s-1]+'</h1><div class="progress mt-3"><i style="width:'+s*20+'%"></i></div></div><section class="card p-4">'+content+'</section><div class="flex gap-2"><button class="btn soft flex-1" '+(s===1?'disabled':'')+' onclick="update({setupStep:Math.max(1,state.setupStep-1)})">← Back</button><button class="btn primary flex-1" onclick="nextSetup()">'+(s===5?'Start my plan 🚀':'Continue →')+'</button></div></div>'}
function notesView(){return '<div class="space-y-4"><div><h1 class="text-2xl font-extrabold">Quick Notes</h1><p class="text-sm muted mt-1">Keep formulas, dates and revision points for '+esc(state.stream)+'.</p></div><section class="card p-4 space-y-3"><input id="note-title" class="field" placeholder="Note title (e.g. Accounting ratios)"><textarea id="note-body" class="field" rows="4" placeholder="Write a formula, key date, definition or revision point…"></textarea><button class="btn primary w-full" onclick="addNote()">＋ Save note</button></section><div class="space-y-3">'+(state.notes.filter(n=>n.stream===state.stream).map(n=>'<article class="card p-4"><div class="flex justify-between gap-2"><b class="text-sm">'+esc(n.title)+'</b><button class="text-rose-600 text-xs font-bold" onclick="deleteNote('+n.id+')">Delete</button></div><p class="text-sm muted mt-2 whitespace-pre-wrap">'+esc(n.body)+'</p><div class="text-[10px] muted mt-3">'+new Date(n.id).toLocaleString()+'</div></article>').join('')||'<div class="card p-5 text-center text-sm muted">No notes saved for this stream yet.</div>')+'</div></div>'}
function tourView(){let steps=[["Welcome to Tracker 360 Pro","Your dashboard brings today's lessons, progress and revision together."],["Choose your stream","Switch Commerce, Arts, NEET and JEE from the top selector."],["Plan your learning","Mark lectures done, move backlog and add practice tasks."],["Free Source library","Find free topic searches and notes, then add lessons to your day."],["Setup your routine","Set teachers, playback speed, revision time and backlog strategy."],["Keep your notes & focus","Use quick notes and the Pomodoro focus timer to stay organised."]];let s=state.tourStep;return '<div class="card p-5 bg-[#211f31] text-white"><div class="text-xs text-purple-200 font-extrabold">GUIDED TOUR · STEP '+(s+1)+' OF 6</div><h2 class="text-xl font-extrabold mt-3">'+steps[s][0]+'</h2><p class="text-sm text-white/70 mt-2">'+steps[s][1]+'</p><div class="flex gap-2 mt-5">'+steps.map((_,i)=>'<span class="stepdot '+(i===s?'on':'')+'"></span>').join('')+'</div><div class="flex justify-between mt-6"><button class="btn bg-white/10 text-white" onclick="update({tourStep:Math.max(0,state.tourStep-1)})">‹ Back</button><button class="btn bg-white text-[#211f31]" onclick="update({tourStep:state.tourStep===5?0:state.tourStep+1})">'+(s===5?'Restart tour':'Next ›')+'</button></div></div>'}
function render(){let app=$("#app");let tab=window.activeTab||"Your day";app.innerHTML='<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-purple-100"><div class="max-w-xl mx-auto px-4 py-3"><div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full purple text-white grid place-items-center font-black text-xs">T360</div><div class="flex-1"><div class="font-extrabold leading-tight">Tracker 360 <span class="ink">Pro</span></div><div class="text-[10px] muted">Your independent study workspace</div></div><select class="field !w-auto max-w-[150px] text-xs font-bold" onchange="switchStream(this.value)">'+Object.keys(CURRICULA).map(k=>'<option value="'+k+'" '+(state.stream===k?'selected':'')+'>'+CURRICULA[k].emoji+' '+CURRICULA[k].label+'</option>').join('')+'</select><button class="btn soft" onclick="focusModal()">⏱ '+String(Math.floor(timer.left/60)).padStart(2,'0')+':'+String(timer.left%60).padStart(2,'0')+'</button></div></div></header>
<main class="max-w-xl mx-auto px-4 pt-4 pb-16 space-y-4"><div class="rounded-xl bg-amber-50 border border-amber-100 p-3 text-xs text-amber-800">✨ One planner for Commerce, Arts, NEET & JEE — plus a free learning resource hub.</div>
<div class="flex gap-2 overflow-x-auto hide-scroll"><button class="navpill '+(state.mode==='Recorded'?'active':'bg-white')+'" onclick="update({mode:'+"'Recorded'"+'})">🎓 Recorded</button><button class="navpill '+(state.mode==='Live'?'active':'bg-white')+'" onclick="update({mode:'+"'Live'"+'})">((•)) Live</button><button class="navpill bg-white" onclick="plannerModal()">＋ New planner</button><button class="navpill green text-white" onclick="setTab('Free Source')">▶ Free Source <span class="text-[9px]">FREE</span></button></div>
<div class="grid grid-cols-4 gap-2"><button class="tabbtn '+(tab==='Your day'?'active':'')+'" onclick="setTab('Your day')">📅<br>Your day</button><button class="tabbtn '+(tab==='Tour'?'active':'')+'" onclick="setTab('Tour')">🧭<br>Tour</button><button class="tabbtn '+(tab==='Setup'?'active':'')+'" onclick="setTab('Setup')">⚙️<br>Setup</button><button class="tabbtn '+(tab==='Notes'?'active':'')+'" onclick="setTab('Notes')">📝<br>Notes</button></div>
<div id="view">'+(tab==='Your day'?dayView():tab==='Free Source'?'<div id="source-area">'+sourceView()+'</div>':tab==='Setup'?setupView():tab==='Notes'?notesView():tourView())+'</div>
<footer class="text-center text-[10px] muted pt-4">Independent learning planner · Not affiliated with Physics Wallah. Progress and notes are saved on this device.</footer></main>
<div id="modal" class="hidden fixed inset-0 z-50 modalbg flex items-end sm:items-center justify-center p-3" onclick="if(event.target===this)closeModal()"><div class="bg-white rounded-2xl w-full max-w-lg max-h-[88vh] overflow-y-auto p-5"><div class="flex justify-between items-center mb-4"><h2 id="modal-title" class="text-lg font-extrabold"></h2><button onclick="closeModal()" class="text-2xl muted">×</button></div><div id="modal-body"></div></div></div>';
}
function setTab(t){window.activeTab=t;render()}
function refreshSource(){let q=$("#source-search")?.value||"";let f=window.sourceFilter||"All";let cards=FREE.filter(v=>(f==="All"||v[0]===f||v[2]===f)&&v.join(" ").toLowerCase().includes(q.toLowerCase()));let el=$("#source-cards");if(el)el.innerHTML=cards.map(v=>'<article class="source-card p-4"><span class="pill green-soft">'+esc(v[0])+'</span><h3 class="font-bold mt-2">'+esc(v[1])+'</h3><p class="text-xs muted mt-1">'+esc(v[4])+' · '+esc(v[3])+'</p><div class="flex gap-2 mt-3"><button class="btn green" onclick="watchFree('+FREE.indexOf(v)+')">▶ Watch Free</button><button class="btn green-soft" onclick="showNotes('+FREE.indexOf(v)+')">📄 PDF Notes</button><button class="btn soft" onclick="addFree('+FREE.indexOf(v)+')">＋ Add to Day</button></div></article>').join('')||'<div class="card p-4 text-sm muted">No matching resources found.</div>';let count=$("#source-count");if(count)count.textContent=cards.length+' learning resources'}
function watchFree(i){let v=FREE[i],url='https://www.youtube.com/results?search_query='+encodeURIComponent(v[1]+' '+v[0]+' free full lecture');openModal('Watch free · '+v[0],'<div class="rounded-xl bg-gray-950 text-white aspect-video grid place-items-center text-center p-5"><div><div class="text-4xl">▶</div><div class="font-bold mt-2">Free video search</div><p class="text-xs text-white/60 mt-1">Choose a suitable public lecture from the search results.</p></div></div><p class="text-sm font-bold mt-3">'+esc(v[1])+'</p><p class="text-xs muted mt-1">'+esc(v[4])+' · '+esc(v[3])+'</p><a class="btn green block text-center mt-3" target="_blank" rel="noopener" href="'+url+'">Open free YouTube results ↗</a><button class="btn primary w-full mt-2" onclick="completeVideo('+i+')">✓ Mark Completed (+50 XP)</button>')}
function completeVideo(i){if(!state.doneVideos.includes(i))state.doneVideos.push(i);save();closeModal();toast('Completed · +50 XP')}
function showNotes(i){let v=FREE[i];openModal('Chapter notes · '+v[0],'<div class="space-y-3 text-sm"><div class="pill green-soft">'+esc(v[0])+'</div><h3 class="font-extrabold">'+esc(v[1])+'</h3><p class="muted">'+esc(v[5])+'</p><h4 class="font-bold">Revision checklist</h4><ul class="list-disc pl-5 space-y-1"><li>Read the textbook section and note key definitions.</li><li>Write the important formulas, dates or concepts in your own words.</li><li>Solve 5–10 practice questions and review mistakes.</li><li>Revisit this topic after one day and again after one week.</li></ul><button class="btn green w-full" onclick="downloadNotes('+i+')">↓ Download notes (.txt)</button></div>')}
function downloadNotes(i){let v=FREE[i],txt=v[1]+'\n'+v[0]+'\n\n'+v[5]+'\n\nRevision checklist\n- Read textbook section and note key definitions.\n- Write formulas, dates or concepts in your own words.\n- Solve practice questions and review mistakes.\n- Revise after one day and one week.';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=v[0].toLowerCase().replaceAll(' ','-')+'-revision-notes.txt';a.click();URL.revokeObjectURL(a.href);toast('Notes downloaded')}
function addFree(i){let v=FREE[i],id=Date.now();state.tasks.push({id,subject:v[0],teacher:v[4],title:v[1],chapter:v[1],kind:'FREE VIDEO',minutes:90,done:false,due:'Today',percent:0});save();toast('Added to today’s plan');setTab('Your day')}
function watchTask(id){let t=state.tasks.find(x=>x.id===id);let url='https://www.youtube.com/results?search_query='+encodeURIComponent(t.title+' '+t.subject+' lecture');openModal('Lecture player', '<div class="bg-gray-950 text-white aspect-video rounded-xl grid place-items-center"><div class="text-center"><div class="text-4xl">▶</div><div class="font-bold mt-2">Open the learning video</div><div class="text-xs text-white/60 mt-1">External public video search</div></div></div><p class="font-bold mt-3">'+esc(t.title)+'</p><a target="_blank" rel="noopener" class="btn primary block text-center mt-3" href="'+url+'">Open video results ↗</a><button class="btn soft w-full mt-2" onclick="doneTask('+id+');closeModal()">✓ Mark lecture done</button>')}
function plannerModal(){openModal('Your study planners','<p class="text-sm muted">Switch between up to three saved planner spaces.</p><div class="space-y-2 mt-3">'+state.planners.map((p,i)=>'<button class="w-full text-left p-3 border rounded-xl '+(i===state.planner?'border-purple-400 bg-purple-50':'')+'" onclick="switchPlanner('+i+')"><b class="text-sm">Planner '+(i+1)+' · '+esc(p.name)+'</b><div class="text-xs muted mt-1">'+esc(p.stream)+'</div></button>').join('')+'</div><p class="text-[11px] muted mt-3">Each planner keeps its own label and stream. Progress is saved locally on this device.</p>')}
function switchPlanner(i){state.planner=i;state.stream=state.planners[i].stream;state.tasks=seedTasks();state.selectedSubjects=subjects().map(s=>s[0]);save();closeModal();render();toast('Planner switched')}
function focusModal(){openModal('Pomodoro focus timer','<div class="text-center"><div id="clock" class="text-5xl font-extrabold ink py-5">'+String(Math.floor(timer.left/60)).padStart(2,'0')+':'+String(timer.left%60).padStart(2,'0')+'</div><p class="text-sm muted">Focus session · 25 minutes</p><div class="flex gap-2 mt-5"><button class="btn primary flex-1" onclick="startTimer()">Start</button><button class="btn soft flex-1" onclick="pauseTimer()">Pause</button><button class="btn soft flex-1" onclick="resetTimer()">Reset</button></div></div>')}
function startTimer(){if(timer.running)return;timer.running=true;timer.interval=setInterval(()=>{timer.left--;let c=$("#clock");if(c)c.textContent=String(Math.floor(timer.left/60)).padStart(2,'0')+':'+String(timer.left%60).padStart(2,'0');let b=document.querySelector('header button:last-child');if(b)b.textContent='⏱ '+String(Math.floor(timer.left/60)).padStart(2,'0')+':'+String(timer.left%60).padStart(2,'0');if(timer.left<=0){pauseTimer();toast('Focus session complete! Take a short break.')}},1000)}
function pauseTimer(){timer.running=false;clearInterval(timer.interval)}
function resetTimer(){pauseTimer();timer.left=1500;let c=$("#clock");if(c)c.textContent='25:00';render()}
function resetDay(){if(confirm('Reset today’s completion marks?')){state.tasks=state.tasks.map(t=>t.due==='Today'?{...t,done:false}:t);state.revisionDone=false;save();render();toast('Today reset')}}
function allDone(){state.tasks=state.tasks.map(t=>t.due==='Today'?{...t,done:true}:t);state.revisionDone=true;save();render();toast('Great work — today is complete!')}
function backlog(a){if(a==='date')openModal('Finish backlog by a date','<label class="text-sm font-bold">Target date<input id="backlog-date" type="date" class="field mt-2"></label><button class="btn primary w-full mt-3" onclick="state.backlogAction=\'date: \'+$(\'#backlog-date\').value;save();closeModal();toast(\'Backlog target saved\')">Save target date</button>');else{state.backlogAction=a;save();toast(a==='daily'?'Backlog spread across your days':'We’ll leave the backlog unchanged for now')}}
function testPriority(yes){state.testAction=yes?'Prioritise unrevised chapters':'Keep current plan';save();toast(state.testAction)}
function openTest(){openModal('Practice test · '+state.stream,'<div class="pill amber-soft">Practice assessment · 15 minutes</div><h3 class="font-extrabold text-lg mt-3">Ready for a quick knowledge check?</h3><p class="text-sm muted mt-2">This demo practice module creates a focused revision task. Full stream-specific test papers can be added to the content library.</p><button class="btn primary w-full mt-4" onclick="state.tasks.push({id:Date.now(),subject:subjects()[0][0],teacher:\'Practice Bank\',title:\'Mock test practice\',kind:\'TEST\',minutes:45,done:false,due:\'Today\',percent:0});save();closeModal();render();toast(\'Practice test added to today\')">Add test session to today</button>')}
function chooseDpp(){openModal('Choose practice items','<div class="space-y-2">'+CURRICULA[state.stream].practice.map((p,i)=>'<button class="w-full text-left p-3 border rounded-xl text-sm" onclick="addPractice('+i+')">＋ '+esc(p)+'</button>').join('')+'</div>')}
function addPractice(i){let p=CURRICULA[state.stream].practice[i];state.tasks.push({id:Date.now(),subject:subjects()[0][0],teacher:'Practice Bank',title:p,kind:'DPP',minutes:30,done:false,due:'Today',percent:0});save();closeModal();render();toast('Practice item added')}
function autoDpp(){CURRICULA[state.stream].practice.slice(0,2).forEach((p,i)=>state.tasks.push({id:Date.now()+i,subject:subjects()[i]?.[0]||subjects()[0][0],teacher:'Practice Bank',title:p,kind:'DPP',minutes:25,done:false,due:'Today',percent:0}));save();render();toast('Practice items scheduled')}
function toggleTeacher(i,on){let n=subjects()[i][1];state.teachers=on?[...new Set([...state.teachers,n])]:state.teachers.filter(x=>x!==n);state.selectedSubjects=on?[...new Set([...state.selectedSubjects,subjects()[i][0]])]:state.selectedSubjects.filter(x=>x!==subjects()[i][0]);save();render()}
function setSpeed(v){state.speed=+v;save();let s=document.querySelector('#view');if(s)s.innerHTML=setupView()}
function nextSetup(){if(state.setupStep<5)update({setupStep:state.setupStep+1});else{state.setupDone=true;state.setupStep=1;save();setTab('Your day');toast('Your study plan is ready!')}}
function addNote(){let title=$('#note-title').value.trim(),body=$('#note-body').value.trim();if(!title||!body){toast('Add a title and note first');return}state.notes.unshift({id:Date.now(),title,body,stream:state.stream});save();render();toast('Note saved')}
function deleteNote(id){state.notes=state.notes.filter(n=>n.id!==id);save();render();toast('Note deleted')}
render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
