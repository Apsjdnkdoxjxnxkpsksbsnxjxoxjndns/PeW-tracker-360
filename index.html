<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5A4BDA"><title>StudyTrack 360 — Student Planner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:#f6f5fb;color:#211f31}.purple{background:#5A4BDA}.ink{color:#5A4BDA}.card{background:white;border:1px solid #ebe9f3;border-radius:18px;box-shadow:0 2px 10px #24204408}.pill{border-radius:999px}.btn{border-radius:12px;padding:10px 14px;font-weight:650}.btn-primary{background:#5A4BDA;color:white}.btn-soft{background:#f0efff;color:#5145c5}.muted{color:#77748a}.progress{height:8px;border-radius:20px;background:#eeedf5;overflow:hidden}.progress>i{display:block;height:100%;background:#5A4BDA;border-radius:20px}.modal-bg{background:#17142b88}.tab{padding:9px 12px;border-radius:11px;font-weight:650}.tab.active{background:#5A4BDA;color:white}.field{border:1px solid #dedbe9;border-radius:11px;padding:10px;width:100%;background:white}.label{font-size:12px;font-weight:700;color:#77748a;margin-bottom:5px;display:block}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StudyTrack 360">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const initial={
 batch:"Kautilya Commerce 12", stream:"Commerce", mode:"Recorded", dayDone:2, streak:7, setupStep:1,
 tasks:[
  {id:1,subject:"Accountancy",title:"Accounting for Partnership — Lecture 04",teacher:"Commerce faculty",kind:"Lecture",due:"Overdue",duration:"1h 20m",done:false,percent:62},
  {id:2,subject:"Business Studies",title:"Principles of Management — Lecture 06",teacher:"Commerce faculty",kind:"Lecture",due:"Today",duration:"55m",done:false,percent:0},
  {id:3,subject:"Economics",title:"National Income — DPP 03",teacher:"Practice bank",kind:"DPP",due:"Today",duration:"25m",done:true,percent:100}
 ],
 subjects:["Accountancy","Business Studies","Economics","English","Applied Mathematics"],
 tests:[{title:"Partnership Accounts — Chapter Test",questions:5,score:null}],
 selectedSubjects:["Accountancy","Business Studies","Economics","English"],
 teachers:["CA Rajat Arora","Love Kaushik","Saleem Sir","Sachin Jakhar"],
 pace:120,speed:1.5,revision:20,style:"Weekly Timetable"
};
function App(){
 const [data,setData]=useState(()=>{try{return {...initial,...JSON.parse(localStorage.getItem("studytrack360")||"{}")}}catch{return initial}});
 const [tab,setTab]=useState("Your day"),[modal,setModal]=useState(""),[expanded,setExpanded]=useState("Your subjects");
 const [batchOpen,setBatchOpen]=useState(false),[mobile,setMobile]=useState(""),[batchCode,setBatchCode]=useState("");
 const [question,setQuestion]=useState(0),[answers,setAnswers]=useState({}),[testResult,setTestResult]=useState(null);
 const [newDpp,setNewDpp]=useState("Accountancy — DPP 04");
 useEffect(()=>localStorage.setItem("studytrack360",JSON.stringify(data)),[data]);
 const update=(k,v)=>setData(d=>({...d,[k]:v}));
 const toggleTask=id=>setData(d=>({...d,tasks:d.tasks.map(t=>t.id===id?{...t,done:!t.done}:t)}));
 const moveTask=(id,when)=>setData(d=>({...d,tasks:d.tasks.map(t=>t.id===id?{...t,due:when}:t)}));
 const questions=[
  {q:"Which statement is prepared to find the net profit or loss of a business?",opts:["Balance Sheet","Profit and Loss Account","Cash Flow Statement","Trial Balance"],a:1,why:"The Profit and Loss Account summarises incomes and expenses to determine net profit or loss."},
  {q:"Goodwill is generally classified as which type of asset?",opts:["Current asset","Fictitious asset","Intangible asset","Tangible asset"],a:2,why:"Goodwill is an identifiable value arising from reputation and other advantages, so it is intangible."},
  {q:"A partner's capital account is shown under which heading in the balance sheet?",opts:["Assets","Liabilities","Revenue","Expenses"],a:1,why:"Partners' capital is presented on the equity/liabilities side."},
  {q:"The sacrificing ratio is calculated when there is:",opts:["Admission of a partner","Dissolution only","Cash purchase","Issue of shares"],a:0,why:"At admission, old partners may sacrifice a share of future profits."},
  {q:"A debit balance in the Profit and Loss Account indicates:",opts:["Profit","Loss","Capital","Goodwill"],a:1,why:"A debit balance represents accumulated loss."}
 ];
 const finishTest=()=>{const score=questions.reduce((s,q,i)=>s+(answers[i]===q.a?1:0),0);setTestResult(score);update("tests",[{title:"Partnership Accounts — Chapter Test",questions:5,score},...data.tests.slice(1)])};
 const resetTest=()=>{setQuestion(0);setAnswers({});setTestResult(null)};
 const completed=data.tasks.filter(t=>t.done).length;
 const total=data.tasks.length;
 const chooseBatch=b=>{update("batch",b);setBatchOpen(false)};
 const accordion=(name,content)=><div className="card overflow-hidden"><button onClick={()=>setExpanded(expanded===name?"":name)} className="w-full flex justify-between items-center p-4 text-left font-bold">{name}<span className="ink">{expanded===name?"−":"＋"}</span></button>{expanded===name&&<div className="px-4 pb-4">{content}</div>}</div>;
 const taskCard=t=><div className="card p-4 space-y-3" key={t.id}><div className="flex justify-between gap-2"><div><div className="text-xs font-bold ink">{t.subject} · {t.kind}</div><div className="font-bold mt-1">{t.title}</div><div className="text-xs muted mt-1">{t.teacher} · {t.duration}</div></div><span className={`text-xs h-fit pill px-2 py-1 ${t.done?"bg-green-50 text-green-700":t.due==="Overdue"?"bg-red-50 text-red-600":"bg-amber-50 text-amber-700"}`}>{t.done?"Done":t.due}</span></div>
 {t.kind==="Lecture"&&<><div className="flex justify-between text-xs muted"><span>Watch progress</span><span>{t.done?100:t.percent}%</span></div><div className="progress"><i style={{width:(t.done?100:t.percent)+"%"}}/></div></>}
 <div className="flex flex-wrap items-center gap-2"><button className="btn btn-soft text-sm" onClick={()=>alert("Demo link: open the relevant lesson in your learning app.")}>Open lesson ↗</button><select className="field text-sm !w-auto flex-1 min-w-0" value={t.due} onChange={e=>moveTask(t.id,e.target.value)}><option>Overdue</option><option>Today</option><option>Tomorrow</option><option>This week</option></select><button onClick={()=>toggleTask(t.id)} className={`btn text-sm ${t.done?"btn-soft":"btn-primary"}`}>{t.done?"Undo":"✓ Done"}</button></div></div>;
 return <div className="max-w-md mx-auto min-h-screen pb-10">
 <header className="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-purple-100 px-4 py-3"><div className="flex items-center gap-2"><div className="w-9 h-9 rounded-full purple text-white grid place-items-center font-black">S</div><div className="flex-1"><div className="font-extrabold leading-tight">StudyTrack 360</div><div className="text-[10px] muted">Independent student planner</div></div><button className="text-xs btn btn-soft" onClick={()=>setBatchOpen(!batchOpen)}>{data.batch} ▾</button></div>
 <div className="flex gap-2 mt-3"><button className={`tab flex-1 text-sm ${data.mode==="Recorded"?"active":"bg-gray-100"}`} onClick={()=>update("mode","Recorded")}>Recorded</button><button className={`tab flex-1 text-sm ${data.mode==="Live"?"active":"bg-gray-100"}`} onClick={()=>update("mode","Live")}>Live</button><button className="btn btn-soft text-xs" onClick={()=>setModal("login")}>Log in</button></div>
 {batchOpen&&<div className="absolute left-4 right-4 top-20 card p-2 shadow-xl">{["Kautilya Commerce 12","Aarambh Commerce 11","Parishram Science 12","Vijeta Humanities 12"].map(b=><button key={b} onClick={()=>chooseBatch(b)} className="block text-left p-3 w-full rounded-lg hover:bg-purple-50 text-sm">{b}</button>)}</div>}
 </header>
 <main className="p-4 space-y-4">
 <div className="flex gap-2 bg-gray-100 p-1 rounded-xl">{["Your day","Tour","Setup"].map(x=><button key={x} onClick={()=>setTab(x)} className={`tab flex-1 text-sm ${tab===x?"active":""}`}>{x}</button>)}</div>
 {tab==="Your day"&&<>
 <section className="pt-1"><div className="text-sm muted">Tuesday · Your learning plan</div><h1 className="text-2xl font-extrabold mt-1">Good evening, Student 👋</h1><div className="flex gap-2 mt-3"><span className="pill bg-orange-50 text-orange-700 px-3 py-1 text-xs font-bold">🔥 {data.streak} day streak</span><span className="pill bg-green-50 text-green-700 px-3 py-1 text-xs font-bold">● On track</span></div></section>
 <section className="card p-4"><div className="flex justify-between"><div><div className="text-sm font-bold">Your study time today</div><div className="text-xs muted mt-1">{completed} of {total} tasks completed</div></div><div className="text-right"><div className="text-xl font-extrabold ink">3h 38m</div><div className="text-xs muted">planned left</div></div></div><div className="progress mt-3"><i style={{width:(completed/total*100)+"%"}}/></div></section>
 <div className="space-y-3">{accordion("Your subjects",<div className="space-y-3">{data.subjects.map(s=><div key={s} className="flex justify-between text-sm"><span>{s}</span><span className="muted">{s==="Accountancy"?"8/14 chapters":"In progress"}</span></div>)}</div>)}{accordion("Your tests",<div className="space-y-2 text-sm"><div className="font-semibold">Upcoming: Accountancy chapter test</div><p className="muted">5 questions · Practice your partnership accounts concepts.</p><button className="btn btn-primary text-sm" onClick={()=>{resetTest();setModal("test")}}>Start test</button></div>)}{accordion("Your week",<div className="text-sm space-y-2"><p>Mon — Accountancy + Economics</p><p>Tue — Business Studies + DPP practice</p><p>Wed — English + chapter revision</p><p>Thu — Accountancy test</p><p>Fri — Weekly recap</p></div>)}</div>
 <section><div className="font-extrabold mb-3">Needs your answer</div><div className="grid grid-cols-2 gap-3"><button onClick={()=>setModal("test")} className="card p-3 text-left"><div className="text-xs ink font-bold">AITS CHECK-IN</div><div className="font-bold mt-2 text-sm">Ready for your next test?</div><div className="text-xs muted mt-2">Take a short practice test →</div></button><button onClick={()=>setTab("Tour")} className="card p-3 text-left"><div className="text-xs ink font-bold">BACKLOG CATCHER</div><div className="font-bold mt-2 text-sm">One task at a time</div><div className="text-xs muted mt-2">Review pending lessons →</div></button></div></section>
 <section className="card p-4"><div className="font-bold">Revision & module practice</div><p className="text-sm muted mt-1">Keep concepts fresh with a small revision block and targeted practice.</p><div className="flex gap-2 mt-3"><button className="btn btn-soft text-sm" onClick={()=>setModal("dpp")}>＋ Assign DPP</button><button className="btn btn-primary text-sm" onClick={()=>setModal("test")}>Practice now</button></div></section>
 <section className="card p-4"><div className="text-xs ink font-extrabold tracking-wide">A TEST TO TAKE</div><div className="font-bold mt-2">Partnership Accounts — Chapter Test</div><p className="text-sm muted mt-1">5 MCQs · Instant feedback · Chapter-level practice</p><button onClick={()=>{resetTest();setModal("test")}} className="btn btn-primary mt-3 w-full">Start test</button></section>
 <section><div className="flex justify-between items-center mb-3"><h2 className="font-extrabold">Today's {data.mode} tasks</h2><span className="text-xs muted">{total} tasks</span></div><div className="space-y-3">{data.tasks.map(taskCard)}</div></section>
 <section className="card p-4"><div className="font-bold">Tomorrow's schedule</div><div className="text-sm muted mt-2 space-y-2"><p>09:00 · Accountancy — Partnership revision</p><p>11:00 · Business Studies — Management</p><p>17:00 · Economics — DPP practice</p></div></section>
 </>}
 {tab==="Tour"&&<><h1 className="text-2xl font-extrabold">Your study workspace</h1><p className="text-sm muted">A quick tour of the tools in your independent planner.</p>{[["Plan your day","See lectures, practice tasks, overdue work and tomorrow's schedule."],["Practice bank","Assign DPPs and chapter-wise practice to your daily plan."],["Test centre","Take sample MCQ tests and review instant explanations."],["Progress","Track completed tasks, streaks and weekly consistency." ]].map(([a,b])=><div className="card p-4" key={a}><div className="font-bold">{a}</div><p className="text-sm muted mt-1">{b}</p></div>)}<button className="btn btn-primary w-full" onClick={()=>setModal("dpp")}>Open practice bank</button></>}
 {tab==="Setup"&&<><div><div className="text-xs ink font-bold">PERSONALISE YOUR PLAN · STEP {data.setupStep} OF 4</div><h1 className="text-2xl font-extrabold mt-2">Build your study plan</h1><div className="progress mt-3"><i style={{width:data.setupStep*25+"%"}}/></div></div>
 {data.setupStep===1&&<div className="card p-4"><h2 className="font-bold text-lg">Choose your subjects</h2><p className="text-sm muted mt-1">Select the subjects you are studying this year.</p><div className="mt-4 space-y-3">{["Accountancy","Business Studies","Economics","English","Applied Mathematics","Physics","Chemistry","Biology","History","Political Science","Geography","Psychology","Sociology"].map(s=><label className="flex gap-3 items-center text-sm" key={s}><input type="checkbox" checked={data.selectedSubjects.includes(s)} onChange={e=>update("selectedSubjects",e.target.checked?[...data.selectedSubjects,s]:data.selectedSubjects.filter(x=>x!==s))}/>{s}</label>)}</div></div>}
 {data.setupStep===2&&<div className="card p-4"><h2 className="font-bold text-lg">Build your dream team</h2><p className="text-sm muted mt-1">Choose teachers to associate with your planner. Names below are editable demo examples, not verified batch assignments.</p><div className="mt-4 space-y-3">{["CA Rajat Arora","Love Kaushik","Saleem Sir","Sachin Jakhar","English faculty","Humanities faculty"].map(s=><label className="flex gap-3 items-center text-sm" key={s}><input type="checkbox" checked={data.teachers.includes(s)} onChange={e=>update("teachers",e.target.checked?[...data.teachers,s]:data.teachers.filter(x=>x!==s))}/>{s}</label>)}</div></div>}
 {data.setupStep===3&&<div className="card p-4 space-y-4"><h2 className="font-bold text-lg">Pace & speed calculator</h2><label className="block"><span className="label">Plan length: {data.pace} days</span><input type="range" min="30" max="180" value={data.pace} onChange={e=>update("pace",+e.target.value)} className="w-full"/></label><label className="block"><span className="label">Playback speed: {data.speed}×</span><input type="range" min="1" max="2.5" step=".25" value={data.speed} onChange={e=>update("speed",+e.target.value)} className="w-full"/></label><label className="block"><span className="label">Daily revision: {data.revision} minutes</span><input type="range" min="0" max="90" step="5" value={data.revision} onChange={e=>update("revision",+e.target.value)} className="w-full"/></label><div className="bg-purple-50 rounded-xl p-3 text-sm">Your plan spreads selected topics across {data.pace} days, with {data.revision} minutes reserved for revision each day.</div></div>}
 {data.setupStep===4&&<div className="card p-4"><h2 className="font-bold text-lg">Choose your study style</h2><p className="text-sm muted mt-1">How would you like your planner to arrange subjects?</p>{["Weekly Timetable","One Subject at a Time"].map(s=><button onClick={()=>update("style",s)} className={`w-full text-left p-4 border rounded-xl mt-3 ${data.style===s?"border-purple-500 bg-purple-50":"border-gray-200"}`}><div className="font-bold">{s}</div><div className="text-xs muted mt-1">{s==="Weekly Timetable"?"Mix subjects across the week.":"Focus on one subject before switching."}</div></button>)}</div>}
 <div className="flex gap-2"><button className="btn btn-soft flex-1" disabled={data.setupStep===1} onClick={()=>update("setupStep",data.setupStep-1)}>Back</button><button className="btn btn-primary flex-1" onClick={()=>data.setupStep===4?(setTab("Your day"),update("setupStep",1)):update("setupStep",data.setupStep+1)}>{data.setupStep===4?"Finish setup":"Continue"}</button></div>
 <button className="text-xs muted underline w-full" onClick={()=>{localStorage.removeItem("studytrack360");setData(initial)}}>Reset saved demo data</button>
 </>}
 <footer className="text-center text-[11px] muted pt-3">Independent demo planner · Not affiliated with or endorsed by Physics Wallah. Progress is saved on this device.</footer>
 </main>
 {modal&&<div className="fixed inset-0 z-40 modal-bg flex items-end sm:items-center justify-center p-3" onClick={()=>setModal("")}><div className="bg-white rounded-2xl w-full max-w-md max-h-[90vh] overflow-auto p-5" onClick={e=>e.stopPropagation()}>
 <div className="flex justify-between items-center mb-4"><h2 className="text-lg font-extrabold">{modal==="test"?"Chapter test":modal==="login"?"Connect learning batch":modal==="dpp"?"Practice bank":"StudyTrack"}</h2><button onClick={()=>setModal("")} className="text-xl muted">×</button></div>
 {modal==="test"&&<>{testResult===null?<><div className="flex justify-between text-xs muted mb-3"><span>Partnership Accounts</span><span>Question {question+1} of {questions.length}</span></div><div className="progress mb-4"><i style={{width:(question+1)/questions.length*100+"%"}}/></div><div className="font-bold text-lg">{questions[question].q}</div><div className="space-y-2 mt-4">{questions[question].opts.map((o,i)=><button key={o} onClick={()=>setAnswers(a=>({...a,[question]:i}))} className={`w-full p-3 text-left border rounded-xl text-sm ${answers[question]===i?"border-purple-500 bg-purple-50":""}`}>{String.fromCharCode(65+i)}. {o}</button>)}</div><div className="flex gap-2 mt-5"><button className="btn btn-soft flex-1" disabled={question===0} onClick={()=>setQuestion(q=>q-1)}>Previous</button>{question===questions.length-1?<button className="btn btn-primary flex-1" onClick={finishTest}>Submit test</button>:<button className="btn btn-primary flex-1" disabled={answers[question]===undefined} onClick={()=>setQuestion(q=>q+1)}>Next</button>}</div></>:<><div className="text-center py-4"><div className="text-4xl font-black ink">{testResult}/{questions.length}</div><div className="font-bold mt-2">Your practice result</div><p className="text-sm muted mt-1">Review the explanations and try again to improve.</p></div><div className="space-y-3">{questions.map((q,i)=><div className="p-3 rounded-xl bg-gray-50 text-sm" key={i}><div className="font-semibold">{i+1}. {q.q}</div><div className={`mt-1 ${answers[i]===q.a?"text-green-700":"text-red-600"}`}>{answers[i]===q.a?"Correct":"Not quite"} · Answer: {q.opts[q.a]}</div><p className="muted mt-1">{q.why}</p></div>)}</div><button className="btn btn-primary w-full mt-4" onClick={resetTest}>Try again</button></>}</>}
 {modal==="login"&&<div className="space-y-3"><p className="text-sm muted">This independent demo does not connect to PW accounts or collect credentials. Add a local batch label instead.</p><label className="block"><span className="label">Mobile number (optional demo field)</span><input className="field" value={mobile} onChange={e=>setMobile(e.target.value)} placeholder="Enter a display number"/></label><label className="block"><span className="label">Batch code / label</span><input className="field" value={batchCode} onChange={e=>setBatchCode(e.target.value)} placeholder="e.g. COM12"/></label><button className="btn btn-primary w-full" onClick={()=>{if(batchCode.trim())update("batch",batchCode.trim());setModal("")}}>Save local batch label</button></div>}
 {modal==="dpp"&&<div className="space-y-3"><p className="text-sm muted">Pick a practice item to add to your personal task list.</p><select className="field" value={newDpp} onChange={e=>setNewDpp(e.target.value)}>{["Accountancy — DPP 04","Business Studies — DPP 02","Economics — DPP 05","Physics — DPP 01","History — Worksheet 02"].map(x=><option>{x}</option>)}</select><button className="btn btn-primary w-full" onClick={()=>{setData(d=>({...d,tasks:[...d.tasks,{id:Date.now(),subject:newDpp.split(" — ")[0],title:newDpp,teacher:"Practice bank",kind:"DPP",due:"Today",duration:"20m",done:false,percent:0}]}));setModal("")}}>Add to today's plan</button></div>}
 </div></div>}
 </div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((error) => console.warn("Offline support unavailable:", error));
  });
}
</script>
</body></html>
